services:
  - type: web
    name: uamp-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://uamp-frontend.onrender.com
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
